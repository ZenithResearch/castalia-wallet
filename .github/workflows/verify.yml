name: Verify

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: '1.85.1'
  WASM_PACK_VERSION: '0.14.0'
  WASM_PACK_SHA256: '278a8d668085821f4d1a637bd864f1713f872b0ae3a118c77562a308c0abfe8d'

jobs:
  verify:
    name: Portable source gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js 20.20.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20.20.0'
          cache: npm

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Detect optional Rust and custody surfaces
        id: surfaces
        shell: bash
        run: |
          if [[ -f Cargo.toml ]]; then echo 'rust=true' >> "$GITHUB_OUTPUT"; else echo 'rust=false' >> "$GITHUB_OUTPUT"; fi
          if [[ -f scripts/verify-custody-vector.py ]]; then echo 'custody=true' >> "$GITHUB_OUTPUT"; else echo 'custody=false' >> "$GITHUB_OUTPUT"; fi

      - name: Set up pinned Rust toolchain
        if: steps.surfaces.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Install Node dependencies from lockfile
        run: npm ci

      - name: Install checksum-pinned wasm-pack release
        if: steps.surfaces.outputs.rust == 'true'
        shell: bash
        run: |
          archive="wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          url="https://github.com/wasm-bindgen/wasm-pack/releases/download/v${WASM_PACK_VERSION}/${archive}"
          tmp="$(mktemp -d)"
          curl --fail --location --silent --show-error "$url" --output "$tmp/$archive"
          printf '%s  %s\n' "$WASM_PACK_SHA256" "$tmp/$archive" | sha256sum --check
          tar --extract --gzip --file "$tmp/$archive" --directory "$tmp" --strip-components=1
          install -m 0755 "$tmp/wasm-pack" "$CARGO_HOME/bin/wasm-pack"
          wasm-pack --version

      - name: Verify CI policy contract
        run: node --test scripts/verify-ci-workflow.test.mjs

      - name: Verify D0 membership contract and vectors
        run: node --test scripts/verify-d0-contract.test.mjs

      - name: Run Node tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build packages
        run: npm run build

      - name: Validate extension package
        run: npm run validate:extension-package

      - name: Exercise neutral package and exact inspection
        env:
          CASTALIA_EXTENSION_OUTPUT: build/castalia-wallet-v3-ci-contract
        run: |
          npm run package:production-extension
          npm run inspect:production-extension

      - name: Check Rust formatting
        if: steps.surfaces.outputs.rust == 'true'
        run: cargo fmt --all -- --check

      - name: Test Rust workspace
        if: steps.surfaces.outputs.rust == 'true'
        run: cargo test --locked --workspace --all-targets

      - name: Run strict Rust Clippy
        if: steps.surfaces.outputs.rust == 'true'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Verify custody vector independently
        if: steps.surfaces.outputs.custody == 'true'
        run: |
          python -m pip install --disable-pip-version-check \
            'blake3==1.0.8' \
            'argon2-cffi==25.1.0' \
            'cryptography==46.0.5' \
            'rfc8785==0.1.4'
          python scripts/verify-custody-vector.py

      - name: Loaded-browser custody smoke — external gate
        if: always()
        run: |
          echo 'Loaded-browser custody smoke is not executed on hosted CI.'
          echo 'Run npm run smoke:extension-custody on a supported persistent Chrome/Chromium host before merge.'
