name: Wallet standard checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standard:
    name: Wallet standard schemas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out standard draft
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install schema validators
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.26.0' 'referencing==0.37.0'
      - name: Validate descriptors and file publications offline
        run: |
          python docs/standards/cws-001/validate.py
          python docs/standards/cws-001/validate-files.py
