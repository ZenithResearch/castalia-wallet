name: Package production Wallet

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: '1.85.1'
  WASM_PACK_VERSION: '0.14.0'
  WASM_PACK_SHA256: '278a8d668085821f4d1a637bd864f1713f872b0ae3a118c77562a308c0abfe8d'

jobs:
  package:
    name: Verified production package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js 20.20.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20.20.0'
          cache: npm

      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      - name: Install dependencies
        run: npm ci

      - name: Install checksum-pinned wasm-pack release
        shell: bash
        run: |
          archive="wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          url="https://github.com/wasm-bindgen/wasm-pack/releases/download/v${WASM_PACK_VERSION}/${archive}"
          tmp="$(mktemp -d)"
          curl --fail --location --silent --show-error "$url" --output "$tmp/$archive"
          printf '%s  %s\n' "$WASM_PACK_SHA256" "$tmp/$archive" | sha256sum --check
          tar --extract --gzip --file "$tmp/$archive" --directory "$tmp" --strip-components=1
          install -m 0755 "$tmp/wasm-pack" "$CARGO_HOME/bin/wasm-pack"

      - name: Build, package, and inspect the production Wallet
        run: |
          npm run package:production-extension
          npm run inspect:production-extension

      - name: Upload exact production package for owner acceptance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: castalia-wallet-production-${{ github.sha }}
          path: |
            build/castalia-wallet-production
            build/castalia-wallet-production.contents.sha256
          if-no-files-found: error
          retention-days: 30
