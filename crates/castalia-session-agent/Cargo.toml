[package]
name = "castalia-session-agent"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
castalia-wallet-core = { path = "../castalia-wallet-core" }
castalia-wallet-private-files = { path = "../castalia-wallet-private-files" }
secs-grant-contract = { path = "../../vendor/secs-grant-contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
hex = "0.4"
sha2 = "0.10"

[dev-dependencies]
ed25519-dalek = "2.2"
tempfile = "3"
