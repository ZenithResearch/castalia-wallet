[package]
name = "castalia-wallet-cli"
version = "0.1.0"
edition = "2024"
publish = false
description = "Interactive credential-bound presentations using explicit raw32 custody."

[[bin]]
name = "castalia-wallet-present-credential-v2"
path = "src/main.rs"

[dependencies]
castalia-wallet-presentation = { path = "../castalia-wallet-presentation" }
castalia-wallet-private-files = { path = "../castalia-wallet-private-files" }
ed25519-dalek = { version = "2.2", features = ["zeroize"] }
getrandom = "0.2"
hex = "0.4"
serde_json = "1"
zeroize = "1"

[dev-dependencies]
base64 = "0.22"
libc = "0.2"
tempfile = "3"
