[package]
name = "castalia-wallet-service-holder"
version = "0.1.0"
edition = "2021"
description = "Opt-in native service custody and challenge validation; qualified signing remains unavailable"
publish = false
autobins = false

[workspace]
resolver = "2"
exclude = ["../castalia-wallet-private-files", "../../vendor/secS-magik-7e32f13", "../../vendor/secS-magik-7e32f13/core", "../../vendor/secS-magik-7e32f13/server", "../../vendor/secS-magik-7e32f13/permissions", "../../vendor/secS-magik-7e32f13/crates/secs-service-call-contract", "vendor/secS-service-b", "vendor/secS-service-b/core", "vendor/secS-service-b/client", "vendor/secS-service-b/server", "vendor/secS-service-b/permissions", "vendor/secS-service-b/panel", "vendor/secS-service-b/crates/secs-service-call-contract", "vendor/secS-service-b/vendor/castalia-wallet-private-files-9cc8140"]
[features]
preserve-order = ["serde_json/preserve_order"]
hostile-json-features = ["serde_json/preserve_order", "serde_json/arbitrary_precision", "server/hostile-json-features"]
[dependencies]
server = { path = "vendor/secS-service-b/server" }
libsec-core = { path = "vendor/secS-service-b/core" }
secs-service-call-contract = { path = "vendor/secS-service-b/crates/secs-service-call-contract" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.11.0"
ed25519-dalek = { version = "=2.2.0", features = ["zeroize"] }
castalia-wallet-private-files = { path = "vendor/secS-service-b/vendor/castalia-wallet-private-files-9cc8140" }
getrandom = "=0.2.17"
zeroize = "=1.8.2"

[dev-dependencies]
secs-permissions = { path = "vendor/secS-service-b/permissions" }
libc = "=0.2.186"
rand = "=0.8.6"
bincode = "=1.3.3"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros", "time"] }
tempfile = "=3.27.0"
