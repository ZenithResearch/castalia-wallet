[package]
name = "castalia-wallet-core"
version = "0.1.0"
edition = "2024"
description = "Encrypted custody core for the Castalia Member Key."
license = "MIT"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
castalia-wallet-presentation = { path = "../castalia-wallet-presentation" }
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
bech32 = "0.11"
blake2 = "0.10"
blake3 = "1"
bs58 = "0.5"
ed25519-dalek = { version = "2.2", features = ["pkcs8", "rand_core", "zeroize"] }
fips204 = { version = "=0.4.6", default-features = false, features = ["ml-dsa-65"] }
getrandom = { version = "0.2", features = ["js"] }
hex = "0.4"
# Already locked transitively; needed to zeroize WASM buffers after copying the approved DEK.
js-sys = "=0.3.104"
k256 = { version = "0.13", default-features = false, features = ["alloc", "arithmetic"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.1"
sha3 = "0.10"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
unicode-normalization = "0.1"
url = "=2.5.2"
wasm-bindgen = "0.2"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"
